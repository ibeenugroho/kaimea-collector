<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="description" content="KAIMEA field data collector — pond water quality and samples, works offline.">
<title>KAIMEA Collector</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Light theme only. Calm teal accent, white cards, generous touch targets. */
:root{
  --bg:#f3f6f5;--panel:#ffffff;--ink:#1b2a28;--muted:#66746f;--line:#e1e7e5;--field:#f8faf9;
  --accent:#0f7a7d;--accent-ink:#0b5f61;--accent-soft:#e3f2f1;--on-accent:#fff;
  --ok:#25804c;--ok-bg:#e3f4ea;--warn:#a2650a;--warn-bg:#fdf1dc;--bad:#c0392f;--bad-bg:#fbe5e2;
  --radius:14px;--shadow:0 1px 2px rgba(20,40,38,.05),0 4px 14px rgba(20,40,38,.05);
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom,0)}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0)) 16px 0;box-shadow:0 2px 10px rgba(20,40,38,.04)}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between;max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand small{font-weight:500;color:var(--muted);font-size:12.5px;line-height:1.2;border-left:1px solid var(--line);padding-left:10px}
.lang{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font:700 12px var(--f);padding:5px 12px;min-height:30px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--panel);color:var(--accent-ink);box-shadow:0 1px 3px rgba(20,40,38,.12)}
.sync{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.4;color:var(--muted);padding:8px 0 2px;max-width:720px;margin:0 auto}
#synctxt{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:#e0a23a;display:inline-block;flex:none;margin-top:5px}
.dot.on{background:#2fa463}.dot.err{background:var(--bad)}
nav{display:flex;gap:4px;max-width:720px;margin:4px auto 0}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--f);padding:10px 4px 11px;border-bottom:3px solid transparent;border-radius:0;min-height:44px}
nav button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}

/* layout & cards */
main{max-width:720px;margin:0 auto;padding:16px 14px 112px}
fieldset{background:var(--panel);border:0;border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 14px;padding:4px 16px 12px;min-width:0}
legend{float:left;width:100%;font:700 12px var(--f);text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink);padding:14px 0 6px;margin:0}
legend+*{clear:both}
.f{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
legend+.f{border-top:0}
.f.wide{grid-template-columns:minmax(0,1fr);gap:6px}
.f label{font-size:14.5px;font-weight:500}
.f label small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.f .warnmsg{grid-column:1/-1;font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:5px 10px}

/* inputs */
input,select,textarea{font:16px var(--f);width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);min-height:46px;transition:border-color .15s,box-shadow .15s,background .15s}
.f:not(.wide) input{text-align:right;font-weight:600}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:#9aa6a2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.req-miss{border-color:var(--bad);background:var(--bad-bg)}
.derived{font-size:13px;color:var(--muted);padding:10px 0 0;border-top:1px solid var(--line);margin-top:2px}

/* sign chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 6px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;background:var(--field);font-size:14px;min-height:42px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip input{width:18px;height:18px;min-height:0;margin:0;accent-color:var(--accent)}

/* buttons */
button{font:600 15px var(--f);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 16px;min-height:46px;cursor:pointer;transition:background .15s,transform .05s}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px rgba(15,122,125,.25)}
button.primary:active{background:var(--accent-ink)}
button.danger{color:var(--bad);border-color:#efc4bf;background:var(--panel)}
button:disabled{opacity:.45;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gps{font-size:13px;color:var(--muted)}

/* bottom action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));box-shadow:0 -4px 16px rgba(20,40,38,.06)}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.bar .primary{flex:1;font-size:16px}

/* records list */
.list{display:flex;flex-direction:column;gap:10px}
.rec{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;position:relative;overflow:hidden}
.rec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warn)}
.rec.synced::before{background:var(--ok)}
.rec .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.rec .m{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.pill{font:700 11px var(--f);text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.p{background:var(--warn-bg);color:var(--warn)}.pill.s{background:var(--ok-bg);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--panel);border:1.5px dashed var(--line);border-radius:var(--radius)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px}
.stats b{display:block;font:700 22px var(--f);color:var(--ink)}
.stats span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* notes, banners, toast */
.note{font-size:13px;color:var(--muted);margin:8px 0 2px;line-height:1.5}
.banner{border-radius:var(--radius);padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.55}
.banner.warn{background:var(--warn-bg);box-shadow:inset 4px 0 0 var(--warn)}
.banner.bad{background:var(--bad-bg);box-shadow:inset 4px 0 0 var(--bad)}
.banner.okb{background:var(--ok-bg);box-shadow:inset 4px 0 0 var(--ok)}
.banner .note{color:inherit;opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0));background:#1b2a28;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}

/* traffic-light labels */
.lt{font:700 10.5px var(--f);text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.lt-ok{background:var(--ok-bg);color:var(--ok)}.lt-warn{background:var(--warn-bg);color:var(--warn)}.lt-bad{background:var(--bad);color:#fff}

/* first-run role picker */
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px;border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pick b{font-size:17px;color:var(--accent-ink)}.pick span{font-weight:400;color:var(--muted);font-size:14px}
.pick:hover,.pick:focus-visible{border-color:var(--accent)}
main h2{color:var(--ink);font-weight:700}

[hidden]{display:none!important}
@media (max-width:370px){.brand img{height:32px}.brand small{font-size:11.5px}.f{grid-template-columns:minmax(0,1fr) 108px}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><img src="icons/wordmark.png" alt="KAIMEA" width="129" height="40"><small id="t-sub">Collector</small></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lg-id" aria-pressed="true">ID</button><button type="button" id="lg-en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="sync" id="sync" aria-live="polite"><span class="dot" id="dot"></span><span id="synctxt">…</span></div>
  <nav role="tablist">
    <button role="tab" id="tab-form" aria-selected="true"></button>
    <button role="tab" id="tab-list" aria-selected="false"></button>
    <button role="tab" id="tab-set" aria-selected="false"></button>
  </nav>
</header>
<main id="view"></main>
<div class="bar" id="bar">
  <div class="in"><button type="button" id="btn-clear"></button><button type="button" class="primary" id="btn-save"></button></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<noscript><p style="padding:16px">JavaScript is required / JavaScript diperlukan.</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
